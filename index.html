<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Monitoramento Residencial</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <h1>Sistema Elétrico Residencial</h1>
            <form id="loginForm">
                <input type="text" id="username" placeholder="Usuário (ex: admin ou morador)" required>
                <input type="password" id="password" placeholder="Senha" required>
                <button type="submit">Acessar Painel</button>
            </form>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
