<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Monitoramento Residencial</title>
    <link rel="stylesheet" href="style.css">
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="dashboard-wrapper">
        <aside class="sidebar">
            <div class="sidebar-header">Painel IoT</div>
            <nav>
                <a href="#" class="active">Visão Geral</a>
                <a href="#">Histórico</a>
                <a href="#">Configurações</a>
                <a href="#" id="logoutBtn">Sair</a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="header">
                <div>Bem-vindo, <strong id="userNameDisplay">Usuário</strong> (<span id="userRoleDisplay">Papel</span>)</div>
                <div class="status-badge">ESP32: Online</div>
            </header>

            <section class="content-area">
                <div id="overloadAlert" class="alert-banner">
                    ⚠️ ALERTA: Sobrecarga detectada na rede! Verifique os disjuntores imediatamente.
                </div>

                <div class="cards-grid">
                    <div class="card">
                        <h3>Tensão (V)</h3>
                        <div class="value" id="tensaoValue">--</div>
                    </div>
                    <div class="card">
                        <h3>Corrente (A)</h3>
                        <div class="value" id="correnteValue">--</div>
                    </div>
                    <div class="card">
                        <h3>Potência (W)</h3>
                        <div class="value" id="potenciaValue">--</div>
                    </div>
                </div>

                <div class="chart-container">
                    <canvas id="consumoChart"></canvas>
                </div>
            </section>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
